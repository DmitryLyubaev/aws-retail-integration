name: Offline verification
on:
  push:
    branches: [main, codex/offline-demo]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Build tooling and run application checks
        run: |
          docker compose --profile test build --pull tooling
          docker compose --profile test run --rm tooling npm run check
          docker compose --profile test run --rm tooling npm run build:cleanup
      - name: Validate mocked infrastructure
        run: node scripts/infra.mjs
      - name: Build and smoke the actual runtime image
        run: |
          docker build --target runtime --build-arg "SOURCE_COMMIT=$GITHUB_SHA" -t p14-runtime:offline .
          docker compose -f compose.yaml -f compose.image.yaml --profile test run --rm tooling npm run test:one -- tests/integration/image.test.ts
      - name: Run declared acceptance and measured report
        run: docker compose --profile test run --rm tooling npm run demo:offline
      - name: Retain reviewed summaries only
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: offline-summaries
          path: |
            docs/offline-report.md
            docs/verification.md
            results/image.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove local test resources
        if: always()
        run: docker compose --profile test down -v --remove-orphans
